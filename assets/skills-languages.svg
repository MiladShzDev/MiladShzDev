<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Programming Languages Skill Cards</title>
  <desc id="desc">Dart, Python, TypeScript and JavaScript skill cards.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#12365a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001a2c" flood-opacity="0.35"/>
    </filter>
    <style>
      .card{fill:url(#card);stroke:#00b4d8;stroke-width:2}
      .name{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;fill:#f6f9ff}
      .sub{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:500;fill:#9edff0}
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect class="card" x="20" y="18" rx="22" ry="22" width="270" height="114"/>
    <circle cx="58" cy="60" r="22" fill="#0175C2"/>
    <text x="58" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">D</text>
    <text class="name" x="92" y="62">Dart</text>
    <text class="sub" x="92" y="88">Language</text>

    <rect class="card" x="310" y="18" rx="22" ry="22" width="270" height="114"/>
    <circle cx="348" cy="60" r="22" fill="#3776AB"/>
    <text x="348" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Py</text>
    <text class="name" x="382" y="62">Python</text>
    <text class="sub" x="382" y="88">Language</text>

    <rect class="card" x="600" y="18" rx="22" ry="22" width="270" height="114"/>
    <circle cx="638" cy="60" r="22" fill="#3178C6"/>
    <text x="638" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">TS</text>
    <text class="name" x="672" y="62">TypeScript</text>
    <text class="sub" x="672" y="88">Language</text>

    <rect class="card" x="890" y="18" rx="22" ry="22" width="290" height="114"/>
    <circle cx="928" cy="60" r="22" fill="#F7DF1E"/>
    <text x="928" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#111">JS</text>
    <text class="name" x="962" y="62">JavaScript</text>
    <text class="sub" x="962" y="88">Language</text>
  </g>
</svg>
