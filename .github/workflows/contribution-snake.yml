name: Generate Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MiladShzDev
          outputs: |
            github-snake.svg?palette=github-light
            github-snake-dark.svg?palette=github-dark

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
          build_commit_message: "chore: update contribution visualization"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
