name: Round skill badges

on:
  push:
    paths:
      - .github/workflows/round-skill-badges.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update skill badge style
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          start = text.index("## 🛠 My Skills")
          end = text.index("\n---", start)
          section = text[start:end]
          section = section.replace("style=for-the-badge", "style=flat")
          section = section.replace('height=\"40\"', 'height=\"42\"')
          path.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/round-skill-badges.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/round-skill-badges.yml
          git commit -m "style: round and enlarge skill badges"
          git push
